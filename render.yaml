services:
  - type: web
    name: wavelength
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_BASE_URL
        value: https://api.meta.ai
      - key: ANTHROPIC_AUTH_TOKEN
        sync: false
      - key: MUSE_MODEL
        value: muse-spark-1.2
      - key: MAX_ANALYSES
        value: 200
      - key: ANALYSIS_MIN_INTERVAL_MS
        value: 8000
      - key: ANALYSIS_EVERY_N_MESSAGES
        value: 4
